{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fw-bold mb-0">Detection Result</h2>
  <a href="{{ url_for('home') }}" class="btn btn-outline-light btn-sm">&larr; New Detection</a>
</div>

<div class="row g-4">
  <div class="col-lg-8">
    <img src="{{ url_for('serve_output', filename=result_file) }}" class="result-media" alt="Detection result">
  </div>
  <div class="col-lg-4">
    <div class="row g-3 mb-3">
      <div class="col-6">
        <div class="stat-box stat-total"><h2>{{ stats.total }}</h2><div class="text-muted-2">Total Slots</div></div>
      </div>
      <div class="col-6">
        <div class="stat-box stat-free"><h2>{{ stats.free }}</h2><div class="text-muted-2">Free</div></div>
      </div>
      <div class="col-6">
        <div class="stat-box stat-occupied"><h2>{{ stats.occupied }}</h2><div class="text-muted-2">Occupied</div></div>
      </div>
      <div class="col-6">
        <div class="stat-box"><h2>{{ stats.occupancy_pct }}%</h2><div class="text-muted-2">Occupancy</div></div>
      </div>
    </div>
    <a href="{{ url_for('download', filename=result_file) }}" class="btn btn-success w-100">⬇ Download Processed Image</a>
  </div>
</div>
{% endblock %}
