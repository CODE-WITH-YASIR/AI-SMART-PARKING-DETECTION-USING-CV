<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI Smart Parking Slot Detection{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1420;
      --card: #161c2c;
      --accent: #4f8cff;
      --accent-2: #34d399;
      --danger: #f87171;
      --text-muted: #9aa4b8;
    }
    body {
      background: radial-gradient(circle at top, #1b2236 0%, var(--bg) 60%);
      color: #e8ecf5;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
    }
    .navbar {
      background: rgba(22, 28, 44, 0.9);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid #232c44;
    }
    .navbar-brand {
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .navbar-brand span { color: var(--accent); }
    .card {
      background: var(--card);
      border: 1px solid #232c44;
      border-radius: 16px;
    }
    .stat-box {
      background: #10162400;
      border: 1px solid #232c44;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
    }
    .stat-box h2 { font-weight: 700; margin-bottom: 4px; }
    .stat-free h2 { color: var(--accent-2); }
    .stat-occupied h2 { color: var(--danger); }
    .stat-total h2 { color: var(--accent); }
    .btn-primary {
      background: var(--accent);
      border: none;
    }
    .btn-primary:hover { background: #3d78e6; }
    .btn-success { background: var(--accent-2); border: none; }
    .text-muted-2 { color: var(--text-muted); }
    footer { color: var(--text-muted); font-size: 0.85rem; }
    .upload-drop {
      border: 1.5px dashed #33405f;
      border-radius: 14px;
      padding: 28px;
      text-align: center;
      transition: 0.2s;
    }
    .upload-drop:hover { border-color: var(--accent); }
    .result-media {
      border-radius: 14px;
      border: 1px solid #232c44;
      width: 100%;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('home') }}">🅿️ Smart<span>Park</span>AI</a>
    </div>
  </nav>

  <div class="container py-5">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="alert alert-warning">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>

  <div class="container pb-4">
    <footer class="text-center">AI Smart Parking Slot Detection &mdash; Computer Vision + SVM</footer>
  </div>
</body>
</html>
